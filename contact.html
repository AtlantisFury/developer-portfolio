<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Contact Andrew Pike</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon_io/favicon-32x32.png" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <a href="./index.html#contact" class="link-secondary"
            >&larr; Back to portfolio</a
          >
          <h1 class="fw-bold mt-3 mb-4">Contact Me</h1>

          <!--
            FormSubmit: the first submission sends an activation email to your
            inbox, which then gives you a random form ID. Put that ID below in
            place of YOUR_RANDOM_ID. Do NOT put your email address here, or it
            will be visible in the page source.
          -->
          <form
            action="https://formsubmit.co/2895fd0996b44f007ec82eaa4bdebe68"
            method="POST"
            class="card shadow-sm card-body">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Your email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="message"
                name="message"
                rows="5"
                required></textarea>
            </div>
            <input
              type="hidden"
              name="_subject"
              value="New message from your portfolio" />
            <!-- Honeypot: hidden from people, filled in by spam bots -->
            <input
              type="text"
              name="_honey"
              class="d-none"
              tabindex="-1"
              autocomplete="off" />
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
